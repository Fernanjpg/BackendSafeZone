spring.application.name=SafeZoneBackend
server.port=8080

spring.cloud.azure.cosmos.endpoint=https://azurecosmo1.documents.azure.com:443/
spring.cloud.azure.cosmos.key=${COSMOS_KEY}
spring.cloud.azure.cosmos.database=SafeZone
spring.cloud.azure.cosmos.populate-query-metrics=false
spring.cloud.azure.cosmos.direct-connection.enabled=false

logging.level.com.azure.cosmos=WARN
logging.level.com.azure.core=WARN
logging.level.SafeZone=INFO

# JWT Configuration (Base64 encoded secret)
jwt.secret=${JWT_SECRET}
# Panic Button Redirection Web Configuration
safezone.panic.neutral-redirect-url=https://www.google.com

